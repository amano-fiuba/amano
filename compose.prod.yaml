services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - ${DATA_DIR:?Falta DATA_DIR en .env}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/amano-fiuba/amano-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      # Correo de verificación (feature 003, D8). En prod son obligatorias
      # (mismo patrón fail-fast que JWT_SECRET): sin SMTP real la feature no
      # funciona y el fallo sería silencioso.
      MAIL_HOST: ${MAIL_HOST:?Falta MAIL_HOST en .env}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Falta MAIL_USERNAME en .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Falta MAIL_PASSWORD en .env}
      APP_BASE_URL: ${APP_BASE_URL:?Falta APP_BASE_URL en .env}
      # Cotizaciones (feature 022): API pública del BCRA, sin credenciales.
      BCRA_BASE_URL: ${BCRA_BASE_URL:-https://api.bcra.gob.ar}
      # Job de vencimiento de deudas (feature 022, D7): cron de 6 campos.
      OVERDUE_CRON: "${OVERDUE_CRON:-0 30 0 * * *}"
      # Job de recordatorios de deudas (feature 025): cron de 6 campos,
      # después del job de vencimiento.
      REMINDERS_CRON: "${REMINDERS_CRON:-0 45 0 * * *}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/amano-fiuba/amano-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_DIR}/caddy:/data
    depends_on:
      - frontend
