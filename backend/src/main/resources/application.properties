spring.application.name=backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amano}
spring.datasource.username=${POSTGRES_USER:amano}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Multipart limits (task T028): 2 MB per avatar file (FR-010; data-model CHECK
# octet_length(data) <= 2097152) and a 3 MB whole-request ceiling. Oversize is
# answered 413 by ProblemDetailExceptionHandler (contract "Errores"); the UI
# validates live first (FR-013) but the backend does not trust the client (FR-022).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Session JWT (task T011): JWT_SECRET required at boot (no default, fail fast);
# JWT_EXPIRATION in seconds, 24 h by default (contract Set-Cookie).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400}

# Email verification — SMTP (task T004, research.md D8): read from env vars with
# development defaults, so the backend still boots when no SMTP is configured and a
# failed send is logged without blocking registration (FR-019). The automated tests
# never talk to real Gmail: the ITs point spring.mail.* to GreenMail in process
# through @DynamicPropertySource (research.md D9).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Gmail on 587 rejects the session with "530 Must issue a STARTTLS command first"
# unless the STARTTLS handshake is enabled, and only then accepts the app-password
# AUTH (research.md D8). `starttls.required` stays false so the in-process GreenMail
# of the ITs (plain SMTP, no TLS) keeps working (research.md D9).
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

# Public base of the verification link: ${APP_BASE_URL}/verify-email?token=...
# Dev default is the Vite dev server (research.md section 4); compose/prod pass
# APP_BASE_URL explicitly.
app.base-url=${APP_BASE_URL:http://localhost:5173}

# Email verification deadlines (task T004, contracts "Plazos"): unitless numbers are
# converted to Duration by VerificationProperties (@DurationUnit SECONDS).
#   token expiration 24 h | resend cooldown 5 min | unverified account expiry 3 days
#   cleanup cron: Spring 6-field cron, hourly at minute 0.
verification.token-expiration=86400
verification.resend-cooldown=300
verification.account-expiration=259200
verification.cron-cleanup=0 0 * * * *
